# Same pipeline for GitLab: test on every push, deploy to GitLab Pages from main
image: node:20

stages: [test, deploy]

cache:
  paths: [node_modules/]

test:
  stage: test
  script:
    - npm ci
    - npm run typecheck
    - npm test

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    - mv dist public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
